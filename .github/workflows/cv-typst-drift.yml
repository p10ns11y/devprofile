name: CV typst drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typst-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install bun, poppler and typst toolchain
        run: |
          npm install -g bun
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate typst CV from cvdata
        run: pnpm generate-pdf
      - name: Fail on cvdata / PDF drift
        run: pnpm check:cv-drift
      - name: ATS 13/13 + 8/8 on the generated PDF
        run: bun node_modules/kanithanj-cv/scripts/typst-ats-smoke.tsx --pdf public/cv.pdf --personal
