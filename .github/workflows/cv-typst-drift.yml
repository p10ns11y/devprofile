name: CV typst drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typst-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate typst CV from cvdata
        run: SOURCE_DATE_EPOCH=0 pnpm generate-pdf
      - name: Fail on cvdata / PDF drift
        run: pnpm check:cv-drift
      - name: Drift mutation suite
        run: pnpm check:cv-mutations
      - name: ATS 13/13 + 8/8 on the generated PDF
        run: |
          MARKERS=$(mktemp)
          node scripts/write-cv-ats-markers.mjs "$MARKERS"
          bun vendor/kanithanj-cv/scripts/typst-ats-smoke.tsx --pdf public/cv.pdf --markers-file "$MARKERS"
