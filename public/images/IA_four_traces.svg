<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="1720" height="1120" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Four traces that look alike in a log: data, context, fact, and memory</title>
  <desc id="desc">Data is what existed. Context is what is loaded now. A fact is a claim treated as currently true. Memory is a past trace kept because it is expected to change a later action.</desc>
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1e1e1e">Four traces, one log</text>
  <text x="430" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4a5568">They look alike in a transcript. Only reuse makes it memory.</text>

  <rect x="28" y="96" width="392" height="168" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="224" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#334155">Data</text>
  <text x="224" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#475569">what existed</text>
  <text x="224" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#64748b">logs, tickets, raw events</text>

  <rect x="440" y="96" width="392" height="168" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="636" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e3a8a">Context</text>
  <text x="636" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1d4ed8">what is loaded now</text>
  <text x="636" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3b82f6">the working set in the window</text>

  <rect x="28" y="284" width="392" height="168" rx="18" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="224" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#4c1d95">Fact</text>
  <text x="224" y="364" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6d28d9">a claim treated as true</text>
  <text x="224" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#7c3aed">may sit unused forever</text>

  <rect x="440" y="284" width="392" height="168" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="636" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#14532d">Memory</text>
  <text x="636" y="364" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#15803d">kept because it will be reused</text>
  <text x="636" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#16a34a">expected to change a later action</text>

  <rect x="28" y="472" width="804" height="68" rx="16" fill="#fffaf7" stroke="#c2410c" stroke-width="2"/>
  <text x="430" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#9a3412">The form is not what makes it memory. Reuse is.</text>
  <text x="430" y="524" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#c2410c">If everything counts as memory, the harness is dumping again.</text>
</svg>
