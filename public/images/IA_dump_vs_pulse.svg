<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="1720" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">Dump versus pulse: flooding the context window versus sparse memory signals</title>
  <desc id="desc">Dumping memory increases n in the wrong direction: more tokens, more noise, more energy. A pulse keeps the working set small and injects a surgical snippet.</desc>
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e1e1e">Dump vs pulse</text>
  <text x="430" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4a5568">Same memory. Two contracts with the runtime.</text>

  <rect x="28" y="92" width="390" height="370" rx="20" fill="#fff5f5" stroke="#ef4444" stroke-width="2"/>
  <text x="223" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#991b1b">Dump  flood the window</text>

  <rect x="56" y="150" width="334" height="54" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="1.5"/>
  <text x="223" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7f1d1d">38k tokens of chat, traces, stale CVs</text>
  <text x="223" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7f1d1d">the locked constraint is somewhere in the middle</text>

  <rect x="56" y="218" width="334" height="40" rx="10" fill="#ffe3e3" stroke="#f87171" stroke-width="1.5"/>
  <text x="223" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7f1d1d">n grows in the wrong direction</text>

  <rect x="56" y="272" width="334" height="40" rx="10" fill="#ffe3e3" stroke="#f87171" stroke-width="1.5"/>
  <text x="223" y="297" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7f1d1d">average over irrelevance · token tax</text>

  <rect x="56" y="326" width="334" height="40" rx="10" fill="#ffe3e3" stroke="#f87171" stroke-width="1.5"/>
  <text x="223" y="351" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7f1d1d">barriers around useful facts drop</text>

  <text x="223" y="414" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#991b1b">Hallucination · lost in the middle</text>
  <text x="223" y="436" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7f1d1d">Leaky mitochondria: heat without work</text>

  <rect x="442" y="92" width="390" height="370" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="637" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#14532d">Pulse  surgical context</text>

  <rect x="470" y="150" width="334" height="54" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="637" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#14532d">compact signal: key · verify · prefetch</text>
  <text x="637" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#14532d">~120 verified tokens, already hashed</text>

  <rect x="470" y="218" width="334" height="40" rx="10" fill="#d3f9d8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="637" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#14532d">working set stays small</text>

  <rect x="470" y="272" width="334" height="40" rx="10" fill="#d3f9d8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="637" y="297" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#14532d">less noise in the models average</text>

  <rect x="470" y="326" width="334" height="40" rx="10" fill="#d3f9d8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="637" y="351" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#14532d">high-barrier fragments arrive intact</text>

  <text x="637" y="414" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#14532d">Next slice already queued</text>
  <text x="637" y="436" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#14532d">Energy per step drops with the working set</text>
</svg>
