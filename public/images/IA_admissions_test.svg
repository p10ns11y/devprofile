<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="1720" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">The admissions test: would this past trace change the next action enough to justify bringing it back?</title>
  <desc id="desc">The test is not did it happen. If yes, it is memory. If no, it is residual data. Both biology and harnesses invent when the trace is incomplete and coherence is cheaper than I don't know.</desc>
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e1e1e">The admissions test</text>
  <text x="430" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4a5568">Not did it happen?  would it change the next action?</text>

  <rect x="180" y="100" width="500" height="72" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="430" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9a3412">Would this past trace change the next action</text>
  <text x="430" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9a3412">enough to justify bringing it back?</text>

  <line x1="430" y1="180" x2="430" y2="210" stroke="#c2410c" stroke-width="2"/>

  <rect x="80" y="220" width="300" height="200" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="230" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#14532d">Yes ’ memory</text>
  <text x="230" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#15803d">sparse, sourced, dated</text>
  <text x="230" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#15803d">allowed to pulse back in</text>
  <text x="230" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#16a34a">leverage on the outcome</text>
  <text x="230" y="396" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#16a34a">high-barrier state</text>

  <rect x="480" y="220" width="300" height="200" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="630" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#475569">No ’ residual data</text>
  <text x="630" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">stays in archive</text>
  <text x="630" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">index only, not fuel</text>
  <text x="630" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">complete but wrong to inject</text>
  <text x="630" y="396" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">dumping by another name</text>

  <rect x="28" y="440" width="804" height="48" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="470" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#991b1b">Dangerous state: completed story with the monitoring barrier down ’ invention fills the gap</text>
</svg>
