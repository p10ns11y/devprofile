<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="1720" height="1120" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">The admissions test: would this past trace change the next action enough to justify bringing it back?</title>
  <desc id="desc">The test is not did it happen. If yes, it is memory. If no, it is residual data. Both biology and harnesses invent when the trace is incomplete and coherence is cheaper than I don't know.</desc>
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1e1e1e">The admissions test</text>
  <text x="430" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4a5568">Not &quot;did it happen?&quot; &#8212; would it change the next action?</text>

  <rect x="120" y="96" width="620" height="88" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="430" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9a3412">Would this past trace change the next action</text>
  <text x="430" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9a3412">enough to justify bringing it back?</text>

  <line x1="430" y1="184" x2="430" y2="216" stroke="#c2410c" stroke-width="2"/>

  <rect x="48" y="224" width="360" height="228" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="228" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#14532d">Yes &#8594; memory</text>
  <text x="228" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#15803d">sparse, sourced, dated</text>
  <text x="228" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#15803d">allowed to pulse back in</text>
  <text x="228" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#16a34a">leverage on the outcome</text>
  <text x="228" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#16a34a">high-barrier state</text>

  <rect x="452" y="224" width="360" height="228" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="632" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#334155">No &#8594; residual data</text>
  <text x="632" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#475569">stays in archive</text>
  <text x="632" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#475569">index only, not fuel</text>
  <text x="632" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#64748b">complete, wrong to inject</text>
  <text x="632" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#64748b">dumping by another name</text>

  <rect x="28" y="472" width="804" height="68" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#991b1b">Dangerous state: a completed story with the barrier down.</text>
  <text x="430" y="524" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#b91c1c">Invention fills the gap. Coherence is cheaper than &quot;I don't know.&quot;</text>
</svg>
