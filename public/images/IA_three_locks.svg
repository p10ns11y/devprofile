<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="1720" height="1120" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Three locks for truthfulness: source, time, and uncertainty</title>
  <desc id="desc">Source: where this came from. Time: when it was true, and whether it was later withdrawn. Uncertainty: permission not to complete the story. Truthfulness is a higher bar inside the filter, not more monitoring.</desc>
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1e1e1e">Three locks</text>
  <text x="430" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4a5568">Not more monitoring. A higher bar inside the filter itself.</text>

  <rect x="24" y="96" width="264" height="392" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="156" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e3a8a">Source</text>
  <text x="156" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1d4ed8">where this came from</text>
  <rect x="44" y="192" width="224" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="156" y="218" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1e40af">seen, heard, imagined</text>
  <rect x="44" y="256" width="224" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="156" y="282" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1e40af">user-stated or verified</text>
  <rect x="44" y="320" width="224" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="156" y="346" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1e40af">inferred or unknown</text>
  <text x="156" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1d4ed8">
    <tspan x="156" dy="0">Keep sources separate</tspan>
    <tspan x="156" dy="22">on purpose</tspan>
  </text>

  <rect x="298" y="96" width="264" height="392" rx="20" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#4c1d95">Time</text>
  <text x="430" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6d28d9">when it was true</text>
  <rect x="318" y="192" width="224" height="52" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="430" y="218" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5b21b6">timestamps, freshness</text>
  <rect x="318" y="256" width="224" height="52" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="430" y="282" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5b21b6">supersession, not nearness</text>
  <rect x="318" y="320" width="224" height="52" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="430" y="346" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5b21b6">later withdrawn</text>
  <text x="430" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6d28d9">
    <tspan x="430" dy="0">Check freshness, not</tspan>
    <tspan x="430" dy="22">only similarity</tspan>
  </text>

  <rect x="572" y="96" width="264" height="392" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="704" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#9a3412">Uncertainty</text>
  <text x="704" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#c2410c">permission not to complete</text>
  <rect x="592" y="192" width="224" height="52" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <text x="704" y="218" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#9a3412">&quot;not in the evidence&quot;</text>
  <rect x="592" y="256" width="224" height="52" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <text x="704" y="282" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#9a3412">write only after a check</text>
  <rect x="592" y="320" width="224" height="52" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <text x="704" y="346" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#9a3412">hypothesis until verified</text>
  <text x="704" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c2410c">
    <tspan x="704" dy="0">If abstention is illegal,</tspan>
    <tspan x="704" dy="22">the model fills</tspan>
  </text>

  <text x="430" y="528" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e1e1e">Pulse = traffic &#183; Admissions = entry &#183; Locks = truthfulness</text>
</svg>
